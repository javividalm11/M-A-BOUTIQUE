<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff8f4">
<title>Panel · M&A Boutique</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="admin">

<!-- ===== LOGIN ===== -->
<div class="admin-login" id="login">
  <form class="admin-card" id="loginForm">
    <span class="brand__logo"><img src="assets/img/logo.png" alt="M&A" width="60" height="60"></span>
    <h1>Panel de administración</h1>
    <p class="sub">M&A Boutique · acceso privado</p>
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit" class="btn btn-gold btn-block">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<!-- ===== APP ===== -->
<div class="admin-app" id="app" hidden>
  <div class="admin-top">
    <div class="brand"><span class="brand__logo"><img src="assets/img/logo.png" alt="M&A" width="34" height="34"></span> Panel M<span style="color:var(--gold)">&amp;</span>A</div>
    <div class="actions">
      <span class="save-state" id="saveState"></span>
      <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">Ver tienda ↗</a>
      <button class="btn btn-gold btn-sm" id="saveBtn">Guardar cambios</button>
      <button class="btn btn-ghost btn-sm" id="logout">Salir</button>
    </div>
  </div>

  <div class="admin-tabs">
    <button data-tab="productos" class="active">🛍️ Productos</button>
    <button data-tab="catalogos">📕 Catálogos PDF</button>
  </div>

  <!-- Productos -->
  <section class="admin-sec" id="sec-productos">
    <div class="admin-toolbar">
      <select id="catFilter"></select>
      <input type="search" id="prodSearch" placeholder="Buscar producto…">
      <button class="btn btn-gold btn-sm" id="addProd">+ Nuevo producto</button>
      <button class="btn btn-ghost btn-sm" id="seedProd">Cargar catálogo actual</button>
    </div>
    <div class="admin-list" id="prodList"></div>
  </section>

  <!-- Catálogos -->
  <section class="admin-sec" id="sec-catalogos" hidden>
    <div class="admin-toolbar">
      <button class="btn btn-gold btn-sm" id="addCat">+ Nuevo catálogo PDF</button>
      <span style="font-size:.82rem;color:var(--muted)">Sube tus catálogos en PDF; aparecerán en la tienda, sección “Catálogos”.</span>
    </div>
    <div class="admin-list" id="catList"></div>
  </section>
</div>

<!-- ===== Modal Producto ===== -->
<div class="admin-modal" id="prodModal">
  <div class="admin-modal__bg" data-close></div>
  <div class="admin-modal__box">
    <h3 id="prodModalTitle">Editar producto</h3>
    <div class="field-row">
      <div class="field"><label>Categoría</label><select id="f-cat"></select></div>
      <div class="field"><label>Tipo / estilo</label><input id="f-tipo" placeholder="Ej. Cargo, Dama, Tacones"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Código (opcional)</label><input id="f-code" placeholder="Ej. AM 881"></div>
      <div class="field"><label>Tallas (separadas por coma)</label><input id="f-sizes" placeholder="Ej. 7, 9, 11"></div>
    </div>
    <div class="field"><label>Título / nombre</label><input id="f-name" placeholder="Nombre del producto"></div>
    <div class="field"><label>Descripción</label><textarea id="f-desc" placeholder="Descripción corta que se ve en la tarjeta"></textarea></div>
    <div class="field"><label>Nota (opcional)</label><input id="f-note" placeholder="Ej. 50 ml · Floral / Tallas XS a XL"></div>
    <div class="field field-check"><input type="checkbox" id="f-featured"><label for="f-featured" style="margin:0">Destacado (aparece en el inicio)</label></div>
    <div class="field">
      <label>Foto del producto</label>
      <input type="file" id="f-img" accept="image/*">
      <div class="up-preview" id="imgPreview">Sin foto</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" data-close>Cancelar</button>
      <button class="btn btn-gold btn-sm" id="prodSave">Aplicar</button>
    </div>
  </div>
</div>

<!-- ===== Modal Catálogo ===== -->
<div class="admin-modal" id="catModal">
  <div class="admin-modal__bg" data-close></div>
  <div class="admin-modal__box">
    <h3 id="catModalTitle">Nuevo catálogo PDF</h3>
    <div class="field"><label>Título del catálogo</label><input id="c-title" placeholder="Ej. Catálogo Julio"></div>
    <div class="field">
      <label>Archivo PDF</label>
      <input type="file" id="c-file" accept="application/pdf">
      <p id="c-fileState" style="font-size:.8rem;color:var(--muted);margin-top:6px"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" data-close>Cancelar</button>
      <button class="btn btn-gold btn-sm" id="catSave">Aplicar</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/js/products.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
